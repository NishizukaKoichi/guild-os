name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match production PostgreSQL and include the vector extension required
        # by canonical-memory semantic search migrations.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: guild_os
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guild_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.9.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install release dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency integrity
        run: |
          pnpm audit:dependencies
          pnpm peers:check

      - name: Verify build, tests, lint, and types
        run: |
          pnpm build
          pnpm test
          pnpm test:cloudflare-os
          pnpm lint
          pnpm types:check

      - name: Verify production Worker bundles
        env:
          GUILD_OS_DEPLOYMENT_CONFIG: ${{ github.workspace }}/fixtures/deployment.ci.jsonc
        run: pnpm check

      - name: Verify Guild browser workflows
        run: |
          pnpm --filter @guild-os/gatekeeper exec playwright install --with-deps chromium
          pnpm --filter @guild-os/gatekeeper test:e2e

      - name: Create non-superuser database owner
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d guild_os -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE ROLE guild_app LOGIN PASSWORD 'guild_app' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE guild_runtime_app LOGIN PASSWORD 'guild_runtime_app' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE guild_os OWNER TO guild_app;
          SQL

      - name: Apply and verify PostgreSQL schema
        env:
          DATABASE_URL: postgresql://guild_app:guild_app@127.0.0.1:5432/guild_os
          GUILD_RUNTIME_DATABASE_ROLE: guild_runtime_app
        run: |
          pnpm db:migrate
          pnpm db:migrate
          pnpm db:provision-runtime -- --allow-insecure-localhost
          pnpm db:verify -- --allow-insecure-localhost

      - name: Verify PostgreSQL Runtime role
        env:
          DATABASE_URL: postgresql://guild_runtime_app:guild_runtime_app@127.0.0.1:5432/guild_os
        run: |
          pnpm --filter @guild-os/postgres test:integration
          pnpm --filter @guild-os/gatekeeper test:integration
